name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Setup System
      run: |
        sudo apt-get install libsqlite3-dev
    - name: Configure
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_FLAGS="-Werror"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Configure
      run: cmake -S . -B build
    - name: Build
      run: cmake --build build --config Release --target clask_test main example-file
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure --timeout 60
